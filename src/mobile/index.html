<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; media-src 'self' blob: https://*.pstatic.net; connect-src 'self' https://*.pstatic.net"
    />
    <title>HLS Multiview</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="streams.css" />
    <link rel="stylesheet" href="tiles.css" />
    <link rel="stylesheet" href="mobile.css" />
  </head>
  <body>
    <header class="bar">
      <nav id="scope-tabs" class="tabs" aria-label="보기 범위"></nav>
      <div class="bar-actions">
        <button id="add-btn" type="button" class="bar-btn" aria-label="방송 추가">＋</button>
        <button id="layout-btn" type="button" class="bar-btn" aria-label="레이아웃 전환"></button>
        <button id="panel-btn" type="button" class="bar-btn" aria-label="방송 목록 · 채팅 패널">패널</button>
        <button id="more-btn" type="button" class="bar-btn" aria-label="메뉴">⋯</button>
      </div>
    </header>

    <main id="body" class="body">
      <section id="grid" class="grid">
        <p id="empty" class="empty">＋ 버튼으로 채널 ID 또는 라이브 주소를 추가해 주세요.</p>
        <div id="tiles"></div>
      </section>

      <section id="panel" class="panel">
        <header class="panel-header">
          <nav class="panel-tabs" role="tablist">
            <button type="button" role="tab" data-tab="list">방송 목록</button>
            <button type="button" role="tab" data-tab="chat">채팅</button>
          </nav>
          <label class="audio-follow">
            <input id="audio-follow" type="checkbox" />
            <span>소리 연동</span>
          </label>
        </header>
        <nav id="chat-tabs" class="chat-tabs" role="tablist" aria-label="방송별 채팅"></nav>
        <div class="panel-body">
          <ul id="stream-list" class="stream-list"></ul>
          <p id="list-empty" class="list-empty" hidden>추가된 방송이 없습니다.</p>
          <div id="chat-slot" class="chat-slot"><p>채팅을 불러오는 중…</p></div>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" hidden></div>

    <dialog id="sheet" class="sheet">
      <p id="sheet-title" class="sheet-title"></p>
      <div id="sheet-items" class="sheet-items"></div>
      <button type="button" class="sheet-cancel" data-close>취소</button>
    </dialog>

    <dialog id="add-dialog" class="sheet">
      <form id="add-form" class="add-form">
        <p class="sheet-title">방송 추가</p>
        <input
          id="channel-input"
          type="text"
          placeholder="채널 ID 또는 chzzk.naver.com/live/… 주소"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          enterkeyhint="done"
        />
        <div class="sheet-row">
          <button type="button" class="sheet-cancel" data-close>취소</button>
          <button type="submit" class="primary">추가</button>
        </div>
      </form>
    </dialog>

    <dialog id="settings-dialog" class="sheet">
      <form id="settings-form" class="settings">
        <p class="sheet-title">설정</p>
        <label class="row">
          <span>
            <strong>소리 연동</strong>
            <small>선택한 채팅의 방송만 소리가 납니다.</small>
          </span>
          <input type="checkbox" name="audioFollowsChat" />
        </label>
        <label class="row">
          <span>
            <strong>최대 화질</strong>
            <small>자동이면 칸 크기에 맞춰 고릅니다. iOS 일부 기기에서는 시스템이 화질을 고릅니다.</small>
          </span>
          <select name="maxQuality">
            <option value="0">자동</option>
            <option value="1080">1080p</option>
            <option value="720">720p</option>
            <option value="480">480p</option>
            <option value="360">360p</option>
          </select>
        </label>
        <label class="row">
          <span>
            <strong>유지할 채팅 수</strong>
            <small>최근 본 채팅을 열어 두어 탭 전환이 바로 됩니다. 많을수록 메모리를 더 씁니다.</small>
          </span>
          <input type="number" name="chatKeepAlive" min="1" max="10" step="1" inputmode="numeric" />
        </label>
        <button type="button" class="sheet-cancel" data-close>닫기</button>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
