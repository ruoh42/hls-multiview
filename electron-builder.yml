appId: io.github.insanephin.hlsmultiview
productName: HLS Multiview
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - "!dist/**/*.map"
  - package.json
asar: true
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.entertainment
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
